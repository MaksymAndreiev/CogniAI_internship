<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avatar Voice Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #13131a;
    --border:   #2a2a3a;
    --accent:   #7c6aff;
    --accent2:  #ff6a9b;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --radius:   12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 32px;
  }

  /* ── Header ── */
  header {
    text-align: center;
  }
  header h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    margin-top: 6px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── Main layout ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    width: 100%;
    max-width: 900px;
  }
  @media (max-width: 640px) {
    .main { grid-template-columns: 1fr; }
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card-title {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Avatar video ── */
  #avatarWrap {
    position: relative;
    aspect-ratio: 9/12;
    background: #0d0d14;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #avatarVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  #avatarPlaceholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 0.8rem;
    font-family: 'Space Mono', monospace;
  }
  #avatarPlaceholder svg {
    width: 48px;
    height: 48px;
    opacity: 0.3;
  }

  /* ── Controls ── */
  .controls { display: flex; flex-direction: column; gap: 12px; }

  /* ── Record button ── */
  #recordBtn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    letter-spacing: 0.04em;
  }
  #recordBtn:hover { opacity: 0.85; transform: translateY(-1px); }
  #recordBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #recordBtn.recording {
    background: linear-gradient(135deg, #ff4444, #ff8844);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
    50%       { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }
  }

  /* ── Status ── */
  #status {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    min-height: 18px;
    text-align: center;
  }
  #status.active { color: var(--accent); }
  #status.error  { color: #ff6666; }

  /* ── Chat log ── */
  #chatLog {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 340px;
    overflow-y: auto;
    padding-right: 4px;
  }
  #chatLog::-webkit-scrollbar { width: 4px; }
  #chatLog::-webkit-scrollbar-track { background: transparent; }
  #chatLog::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
    max-width: 90%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    background: #1e1e2e;
    border: 1px solid var(--border);
    align-self: flex-end;
    color: var(--text);
  }
  .msg.ai {
    background: linear-gradient(135deg, rgba(124,106,255,0.15), rgba(255,106,155,0.1));
    border: 1px solid rgba(124,106,255,0.3);
    align-self: flex-start;
    color: var(--text);
  }
  .msg-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* ── Loading spinner ── */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Pipeline indicator ── */
  .pipeline {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .pip-step {
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }
  .pip-step.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(124,106,255,0.1);
  }
  .pip-step.done {
    border-color: #44cc88;
    color: #44cc88;
    background: rgba(68,204,136,0.08);
  }
  .pip-arrow { color: var(--border); }
</style>
</head>
<body>

<header>
  <h1>Avatar Voice Demo</h1>
  <p>STT · LLM · TTS · D-ID</p>
</header>

<div class="main">

  <!-- Left: Avatar video -->
  <div class="card">
    <span class="card-title">Avatar</span>
    <div id="avatarWrap">
      <video id="avatarVideo" autoplay controls></video>
      <div id="avatarPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span>Avatar will appear here</span>
      </div>
    </div>
  </div>

  <!-- Right: Controls + chat -->
  <div class="card">
    <span class="card-title">Controls</span>

    <div class="pipeline">
      <span class="pip-step" id="pip-mic">MIC</span>
      <span class="pip-arrow">→</span>
      <span class="pip-step" id="pip-stt">STT</span>
      <span class="pip-arrow">→</span>
      <span class="pip-step" id="pip-llm">LLM</span>
      <span class="pip-arrow">→</span>
      <span class="pip-step" id="pip-tts">TTS</span>
      <span class="pip-arrow">→</span>
      <span class="pip-step" id="pip-did">D-ID</span>
    </div>

    <div class="controls">
      <button id="recordBtn">🎤 Hold to Record</button>
      <div id="status">Ready — press and hold to speak</div>
    </div>

    <span class="card-title">Conversation</span>
    <div id="chatLog">
      <div class="msg ai">
        <div class="msg-label">Avatar</div>
        Hello! Press the button and speak to me.
      </div>
    </div>
  </div>

</div>

<script>
  const SERVER = 'http://localhost:3000';

  const recordBtn   = document.getElementById('recordBtn');
  const statusEl    = document.getElementById('status');
  const chatLog     = document.getElementById('chatLog');
  const avatarVideo = document.getElementById('avatarVideo');
  const avatarPH    = document.getElementById('avatarPlaceholder');

  const pipSteps = {
    mic: document.getElementById('pip-mic'),
    stt: document.getElementById('pip-stt'),
    llm: document.getElementById('pip-llm'),
    tts: document.getElementById('pip-tts'),
    did: document.getElementById('pip-did'),
  };

  let mediaRecorder = null;
  let audioChunks   = [];
  let isRecording   = false;
  let chatHistory   = [];
  let stream        = null;

  // ── Pipeline indicator helpers ──────────────────────────────────────────
  function resetPipeline() {
    Object.values(pipSteps).forEach(el => {
      el.classList.remove('active', 'done');
    });
  }
  function setStep(step, state) {
    pipSteps[step].classList.toggle('active', state === 'active');
    pipSteps[step].classList.toggle('done',   state === 'done');
  }

  // ── Status helper ────────────────────────────────────────────────────────
  function setStatus(msg, cls = '') {
    statusEl.className = cls;
    statusEl.innerHTML = msg;
  }

  // ── Chat log helper ──────────────────────────────────────────────────────
  function addMessage(role, text) {
    const wrap  = document.createElement('div');
    wrap.className = `msg ${role}`;
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'You' : 'Avatar';
    wrap.appendChild(label);
    wrap.appendChild(document.createTextNode(text));
    chatLog.appendChild(wrap);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  // ── Recording ────────────────────────────────────────────────────────────
  async function startRecording() {
    if (isRecording) return;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks   = [];

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = processAudio;

      mediaRecorder.start();
      isRecording = true;
      recordBtn.textContent = '⏹ Release to Send';
      recordBtn.classList.add('recording');
      resetPipeline();
      setStep('mic', 'active');
      setStatus('Recording… release to send', 'active');
    } catch (err) {
      setStatus('Microphone access denied', 'error');
    }
  }

  function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    mediaRecorder.stop();
    stream.getTracks().forEach(t => t.stop());
    isRecording = false;
    recordBtn.textContent = '🎤 Hold to Record';
    recordBtn.classList.remove('recording');
    recordBtn.disabled = true;
    setStep('mic', 'done');
  }

  // ── Process audio → pipeline ─────────────────────────────────────────────
  async function processAudio() {
    const blob       = new Blob(audioChunks, { type: 'audio/webm' });
    const arrayBuf   = await blob.arrayBuffer();
    const audioB64   = btoa(String.fromCharCode(...new Uint8Array(arrayBuf)));

    try {
      // STT
      setStep('stt', 'active');
      setStatus('<span class="spinner"></span>Transcribing…', 'active');

      const res = await fetch(`${SERVER}/api/avatar-chat`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          audioBase64:   audioB64,
          audioMimeType: 'audio/webm',
          voice:         'Kore',
          chatHistory:   chatHistory,
        }),
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error(err);
      }

      const data = await res.json();

      // Update pipeline steps visually (server does them sequentially)
      setStep('stt', 'done');
      setStep('llm', 'done');
      setStep('tts', 'done');
      setStep('did', 'done');

      // Chat messages
      if (data.userMessage && data.userMessage !== '[No speech]') {
        addMessage('user', data.userMessage);
        chatHistory.push({ role: 'user', text: data.userMessage });
      }
      if (data.aiMessage) {
        addMessage('ai', data.aiMessage);
        chatHistory.push({ role: 'ai', text: data.aiMessage });
      }

      // Show video
      if (data.videoUrl) {
        avatarVideo.src = data.videoUrl;
        avatarVideo.style.display = 'block';
        avatarPH.style.display    = 'none';
        avatarVideo.play();
        setStatus('Playing avatar response…', 'active');
        avatarVideo.onended = () => setStatus('Ready — press and hold to speak');
      } else {
        setStatus('No video returned from D-ID');
      }

    } catch (err) {
      console.error(err);
      setStatus(`Error: ${err.message}`, 'error');
    } finally {
      recordBtn.disabled = false;
    }
  }

  // ── Button events ────────────────────────────────────────────────────────
  recordBtn.addEventListener('mousedown',  startRecording);
  recordBtn.addEventListener('mouseup',    stopRecording);
  recordBtn.addEventListener('mouseleave', stopRecording);   // release outside btn

  // Touch support (mobile)
  recordBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
  recordBtn.addEventListener('touchend',   e => { e.preventDefault(); stopRecording(); });
</script>
</body>
</html>
